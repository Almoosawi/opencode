name: Build Hardened Desktop

on:
  push:
    tags: ['pdo-v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop (signed)
        env:
          OPENCODE_SIGN_BUILD: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        working-directory: packages/desktop
        run: bun run package:win

      - name: Generate SBOM
        run: bunx @cyclonedx/cdxgen -o sbom.json

      - name: Generate artifact manifest
        shell: bash
        run: |
          INSTALLER=$(find packages/desktop/dist -name '*.exe' -o -name '*.msi' | head -1)
          INSTALLER_HASH=$(sha256sum "$INSTALLER" | cut -d' ' -f1)
          SBOM_HASH=$(sha256sum sbom.json | cut -d' ' -f1)
          UPSTREAM_SHA=$(git rev-parse v1.15.10 2>/dev/null || echo "unknown")
          PATCH_SHA=$(git rev-parse HEAD)
          cat > artifacts.json << EOF
          {
            "version": "${GITHUB_REF_NAME#pdo-v}",
            "upstreamTag": "v1.15.10",
            "upstreamTagSha": "$UPSTREAM_SHA",
            "internalPatchCommit": "$PATCH_SHA",
            "artifacts": [
              { "file": "$(basename $INSTALLER)", "sha256": "$INSTALLER_HASH" },
              { "file": "sbom.json", "sha256": "$SBOM_HASH" }
            ],
            "signed": true,
            "buildTimestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "fortifyScanId": "16664"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: hardened-desktop
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.msi
            sbom.json
            artifacts.json
